<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.25; stroke-width: 1; }
    .node-pulse {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashMove 20s linear infinite;
    }
    .orb-float-1 {
      animation: floatOrb1 10s ease-in-out infinite alternate;
    }
    .orb-float-2 {
      animation: floatOrb2 12s ease-in-out infinite alternate;
    }
    .pill-bounce {
      animation: subtleFloat 6s ease-in-out infinite alternate;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(40px, 25px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-30px, -20px) scale(1.1); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }
    @keyframes subtleFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #94a3b8; }
    .badge-icon { fill: #38bdf8; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 400; fill: #cbd5e1; }
    .tagline-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #38bdf8; letter-spacing: 1.5px; text-transform: uppercase; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs -->
  <g class="orb-float-1">
    <circle cx="200" cy="90" r="140" fill="url(#glowGrad1)" filter="url(#softGlow)" />
  </g>
  <g class="orb-float-2">
    <circle cx="1020" cy="330" r="160" fill="url(#glowGrad2)" filter="url(#softGlow)" />
  </g>

  <!-- Subtle Tech Grid & Dynamic Supply Chain Nodes in Background -->
  <g opacity="0.4">
    <!-- Grid -->
    <line x1="100" y1="0" x2="100" y2="420" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="420" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="420" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="420" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="420" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="420" class="grid-line" />
    <line x1="0" y1="100" x2="1200" y2="100" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line" />

    <!-- Animated Supply Chain Flow Path -->
    <path d="M 80,340 C 260,340 320,80 500,80 S 720,350 920,350 S 1080,120 1150,120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35" class="flow-line" />
    
    <!-- Dynamic Logistics Nodes (Behind Title to avoid obstruction) -->
    <circle cx="500" cy="80" r="5" fill="#38bdf8" opacity="0.6" />
    <circle cx="920" cy="350" r="6" fill="#818cf8" opacity="0.6" />
    <circle cx="80" cy="340" r="4" fill="#38bdf8" opacity="0.5" />
    <circle cx="1150" cy="120" r="5" fill="#c084fc" opacity="0.6" />
  </g>

  <!-- Foreground Main Content Container (Title & Subtitle 100% Crisp & Visible) -->
  <g transform="translate(60, 50)">
    
    <!-- Tagline / Category Chip -->
    <rect x="0" y="10" width="310" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="25" r="4" fill="#38bdf8" />
    <text x="32" y="30" class="tagline-text">Curated Ecosystem Guide</text>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="95" class="title-text">
      Awesome <tspan fill="url(#accentGrad)">Inventory &amp; Order</tspan> Management
    </text>

    <!-- Clear Subtitle -->
    <text x="0" y="140" class="subtitle-text">
      The ultimate directory of SaaS platforms, Open-Source ERP/WMS/OMS repositories &amp; supply chain tools.
    </text>

    <!-- Dynamic Interactive Feature Pills (Floating subtly below subtitle) -->
    <g transform="translate(0, 185)" class="pill-bounce">
      
      <!-- Pill 1: Real-time Stock -->
      <g transform="translate(0, 0)">
        <rect width="200" height="52" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" filter="url(#cardGlow)" />
        <!-- Package Icon -->
        <path d="M 24,19 L 36,13 L 48,19 L 48,33 L 36,39 L 24,33 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
        <path d="M 24,19 L 36,25 L 48,19" fill="none" stroke="#38bdf8" stroke-width="1.8" />
        <path d="M 36,25 L 36,39" fill="none" stroke="#38bdf8" stroke-width="1.8" />
        <text x="58" y="27" class="badge-text" fill="#f1f5f9">Stock Control</text>
        <text x="58" y="42" font-size="11" fill="#64748b" font-family="sans-serif">Multi-Location &amp; Batches</text>
      </g>

      <!-- Pill 2: Omnichannel Fulfillment -->
      <g transform="translate(220, 0)">
        <rect width="210" height="52" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" filter="url(#cardGlow)" />
        <!-- Routing / Sync Icon -->
        <circle cx="36" cy="22" r="5" fill="none" stroke="#818cf8" stroke-width="2" />
        <circle cx="28" cy="34" r="3" fill="#818cf8" />
        <circle cx="44" cy="34" r="3" fill="#818cf8" />
        <path d="M 33,26 L 30,31 M 39,26 L 42,31" stroke="#818cf8" stroke-width="1.5" />
        <text x="58" y="27" class="badge-text" fill="#f1f5f9">Order Fulfillment</text>
        <text x="58" y="42" font-size="11" fill="#64748b" font-family="sans-serif">Omnichannel &amp; Dropship</text>
      </g>

      <!-- Pill 3: WMS & Barcode -->
      <g transform="translate(450, 0)">
        <rect width="190" height="52" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" filter="url(#cardGlow)" />
        <!-- Barcode Icon -->
        <rect x="25" y="20" width="3" height="18" fill="#c084fc" />
        <rect x="31" y="20" width="2" height="18" fill="#c084fc" />
        <rect x="35" y="20" width="5" height="18" fill="#c084fc" />
        <rect x="43" y="20" width="2" height="18" fill="#c084fc" />
        <text x="56" y="27" class="badge-text" fill="#f1f5f9">WMS &amp; Barcode</text>
        <text x="56" y="42" font-size="11" fill="#64748b" font-family="sans-serif">Pick, Pack &amp; Ship</text>
      </g>

      <!-- Pill 4: Open-Source First -->
      <g transform="translate(660, 0)">
        <rect width="200" height="52" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" filter="url(#cardGlow)" />
        <!-- Open Source Heart / Code Icon -->
        <path d="M 32,23 L 26,28 L 32,33 M 40,23 L 46,28 L 40,33" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
        <text x="56" y="27" class="badge-text" fill="#f1f5f9">Open Source &amp; ERP</text>
        <text x="56" y="42" font-size="11" fill="#64748b" font-family="sans-serif">Self-Hosted &amp; Free</text>
      </g>

      <!-- Pill 5: Market Intelligence -->
      <g transform="translate(880, 0)">
        <rect width="200" height="52" rx="12" fill="url(#pillGrad)" stroke="#334155" stroke-width="1" filter="url(#cardGlow)" />
        <!-- Graph Icon -->
        <path d="M 24,35 L 30,29 L 36,32 L 44,22" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
        <circle cx="44" cy="22" r="2.5" fill="#f59e0b" />
        <text x="56" y="27" class="badge-text" fill="#f1f5f9">Market Pricing</text>
        <text x="56" y="42" font-size="11" fill="#64748b" font-family="sans-serif">SaaS Tiers &amp; Valuation</text>
      </g>

    </g>

    <!-- Subtle Footer Metrics Row inside SVG -->
    <g transform="translate(0, 290)">
      <text x="0" y="20" font-family="sans-serif" font-size="12" fill="#64748b">
        📦 Multi-Warehouse Stock Tracking  •  🔄 Automated Order Routing  •  🏷️ Barcode &amp; RFID  •  🚚 Carrier Shipping &amp; 3PL  •  📊 BOM &amp; MRP
      </text>
    </g>
  </g>
</svg>
